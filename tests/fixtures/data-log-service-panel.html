<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>Storico variabili QA</title><style>html,body{margin:0;max-width:100%;background:#202020;color:#eee;font:16px/1.5 system-ui}header{padding:12px;display:flex;flex-wrap:wrap;gap:8px}button{min-height:44px;font:inherit}main{max-width:1400px;margin:auto;padding:8px;box-sizing:border-box}main>section{width:100%;min-height:500px;margin-bottom:16px;box-sizing:border-box}#result{overflow-wrap:anywhere}</style></head><body><header><button id="account" type="button">Account operatore</button><button id="sample" type="button">Campiona Data Log QA</button><span id="result" role="status"></span></header><main><section id="time"></section><section id="xy"></section></main><script type="module">
import { installFramecraftHmiRuntime, requestRuntimeDataLog } from '/src/framecraftHmiRuntime.ts';
import { openOperatorSession } from '/src/framecraftOperatorSession.ts';
const temporal = {version:1,caption:'Temperature dal servizio',timeRangeMs:60000,aggregation:'none',trends:[{id:'time-curve',name:'Temperatura Y',tag:'Y',source:'log',logId:'process',loggedTagId:'y',mode:'interpolated'}]}; document.querySelector('#time').setAttribute('data-hmi-trend',JSON.stringify(temporal));
const xy = {version:1,caption:'Relazione X/Y dal servizio',trends:[{id:'xy-curve',name:'X/Y', x:{source:'log',tag:'X',logId:'process',loggedTagId:'x'},y:{source:'log',tag:'Y',logId:'process',loggedTagId:'y'}, range:{kind:'rolling',durationMs:60000,measuringPoints:1000},pairToleranceMs:1000}]}; document.querySelector('#xy').setAttribute('data-hmi-function-trend',JSON.stringify(xy));
window.disposeDataLogFixture = installFramecraftHmiRuntime({navigate:()=>{},routes:[]});
document.querySelector('#account').addEventListener('click',event=>openOperatorSession(event.currentTarget));
document.querySelector('#sample').addEventListener('click',async()=>{try{const count=await requestRuntimeDataLog('process','manual');document.querySelector('#result').textContent='Campioni registrati: '+count;}catch(error){document.querySelector('#result').textContent=error.message;}});
</script></body></html>
