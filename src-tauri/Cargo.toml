[package]
name = "framecraft"
version = "0.1.0"
description = "Visual React editor"
authors = ["Framecraft"]
edition = "2021"

[lib]
name = "framecraft_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
tempfile = "3"
walkdir = "2"

